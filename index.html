<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A fast, accessible Hello World page published on GitHub Pages." />
  <meta name="theme-color" content="#0b1020" />
  <title>Hello World — GitHub Pages</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --card: #162033;
      --text: #f4f7ff;
      --muted: #d7deee;
      --accent: #7ee0ff;
      --accent-text: #041018;
      --focus: #ffe08a;
    }

    * { box-sizing: border-box; }

    html:focus-within { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 1.125rem;
      line-height: 1.6;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, #1b3a6b 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, #3b1d5c 0%, transparent 42%),
        var(--bg);
    }

    .skip {
      position: absolute;
      left: 0.75rem;
      top: 0.75rem;
      transform: translateY(-200%);
      background: var(--accent);
      color: var(--accent-text);
      padding: 0.6rem 0.9rem;
      border-radius: 0.5rem;
      font-weight: 700;
      text-decoration: none;
      z-index: 2;
    }

    .skip:focus {
      transform: none;
    }

    main {
      width: min(92vw, 560px);
      padding: 2.25rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      background: var(--card);
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    p.kicker {
      margin: 0 0 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 7vw, 3.5rem);
      line-height: 1.2;
    }

    p.sub {
      margin: 1rem 0 0;
      color: var(--muted);
    }

    button {
      margin-top: 1.5rem;
      min-height: 44px;
      min-width: 44px;
      border: 2px solid transparent;
      border-radius: 999px;
      padding: 0.75rem 1.25rem;
      font: inherit;
      font-weight: 700;
      color: var(--accent-text);
      background: var(--accent);
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.08);
    }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      html:focus-within { scroll-behavior: auto; }
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <main id="content">
    <p class="kicker">A tiny site</p>
    <h1>Hello, world</h1>
    <p class="sub" id="status" aria-live="polite">Live on GitHub Pages.</p>
    <button type="button" id="wave" aria-describedby="status">Say it again</button>
  </main>
  <script>
    const status = document.getElementById("status");
    const button = document.getElementById("wave");
    const lines = [
      "Hello from GitHub Pages.",
      "Still just HTML, CSS, and a little JavaScript.",
      "Published from a SuperGrok session.",
      "Hello, world. Again."
    ];
    let i = 0;
    button.addEventListener("click", () => {
      i = (i + 1) % lines.length;
      status.textContent = lines[i];
    });
  </script>
</body>
</html>
