<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello World</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --card: rgba(255, 255, 255, 0.06);
      --text: #f4f7ff;
      --muted: #a9b4d0;
      --accent: #7ee0ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, #1b3a6b 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, #3b1d5c 0%, transparent 42%),
        var(--bg);
    }
    main {
      width: min(92vw, 560px);
      padding: 2.25rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: var(--card);
      backdrop-filter: blur(16px);
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    p.kicker {
      margin: 0 0 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: var(--accent);
    }
    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4rem);
      line-height: 1;
    }
    p.sub {
      margin: 1rem 0 0;
      color: var(--muted);
    }
    button {
      margin-top: 1.5rem;
      border: 0;
      border-radius: 999px;
      padding: 0.75rem 1.2rem;
      font-weight: 600;
      color: #041018;
      background: var(--accent);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">A tiny site</p>
    <h1>Hello, world</h1>
    <p class="sub" id="status">Live on GitHub Pages.</p>
    <button type="button" id="wave">Say it again</button>
  </main>
  <script>
    const status = document.getElementById("status");
    const button = document.getElementById("wave");
    const lines = [
      "Hello from GitHub Pages.",
      "Still just HTML, CSS, and a little JavaScript.",
      "Published from a SuperGrok session.",
      "Hello, world. Again."
    ];
    let i = 0;
    button.addEventListener("click", () => {
      i = (i + 1) % lines.length;
      status.textContent = lines[i];
    });
  </script>
</body>
</html>
